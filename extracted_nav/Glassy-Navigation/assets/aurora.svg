<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="824" viewBox="0 0 720 824" fill="none">
  <title>Violet and cobalt glass backdrop</title>
  <desc>An editable vector background with an illuminated magenta ridge above a dark central hollow, and two broad curved cobalt folds in the foreground.</desc>
  <defs>
    <radialGradient id="purple-haze" cx="0" cy="0" r="1" gradientTransform="translate(541 185) rotate(24) scale(388 392)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33088b"/><stop offset=".39" stop-color="#1b0350"/><stop offset=".74" stop-color="#080014"/><stop offset="1" stop-color="#010005"/>
    </radialGradient>
    <radialGradient id="left-violet" cx="0" cy="0" r="1" gradientTransform="translate(131 -55) rotate(36) scale(428 148)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5611ab"/><stop offset=".33" stop-color="#2f066e"/><stop offset=".67" stop-color="#110025"/><stop offset="1" stop-color="#07000e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta-plane" cx="0" cy="0" r="1" gradientTransform="translate(302 -8) rotate(28) scale(491 302)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d739df"/><stop offset=".2" stop-color="#9820c6"/><stop offset=".42" stop-color="#510b94"/><stop offset=".67" stop-color="#21034d"/><stop offset="1" stop-color="#0b011c"/>
    </radialGradient>
    <radialGradient id="magenta-lower-glow" cx="0" cy="0" r="1" gradientTransform="translate(579 268) rotate(-41) scale(282 108)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9633ef" stop-opacity=".89"/><stop offset=".29" stop-color="#6d1ccc" stop-opacity=".6"/><stop offset=".68" stop-color="#42108b" stop-opacity=".15"/><stop offset="1" stop-color="#20034e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="magenta-rim" x1="226" y1="-12" x2="596" y2="289" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f58cf5"/><stop offset=".34" stop-color="#d982ed"/><stop offset=".7" stop-color="#cf83f2"/><stop offset="1" stop-color="#f0abff"/>
    </linearGradient>
    <radialGradient id="low-violet" cx="0" cy="0" r="1" gradientTransform="translate(115 603) rotate(-38) scale(362 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3514b6"/><stop offset=".28" stop-color="#260ba2"/><stop offset=".55" stop-color="#14045b"/><stop offset=".79" stop-color="#060018"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="back-blue" cx="0" cy="0" r="1" gradientTransform="translate(696 427) rotate(-23) scale(375 274)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#063487"/><stop offset=".37" stop-color="#062d77"/><stop offset=".68" stop-color="#041e52"/><stop offset=".88" stop-color="#031532"/><stop offset="1" stop-color="#03182e"/>
    </radialGradient>
    <radialGradient id="back-reflection" cx="0" cy="0" r="1" gradientTransform="translate(751 1021) rotate(-6) scale(704 788)" gradientUnits="userSpaceOnUse">
      <stop offset=".79" stop-color="#316fca" stop-opacity="0"/><stop offset=".89" stop-color="#2359a1" stop-opacity=".1"/><stop offset=".96" stop-color="#3269b2" stop-opacity=".39"/><stop offset="1" stop-color="#659bd6" stop-opacity=".56"/>
    </radialGradient>
    <linearGradient id="blue-rim" x1="194" y1="586" x2="714" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563bb" stop-opacity=".6"/><stop offset=".3" stop-color="#82baf2"/><stop offset=".64" stop-color="#a1ccef"/><stop offset="1" stop-color="#6274c3" stop-opacity=".84"/>
    </linearGradient>
    <radialGradient id="front-blue" cx="0" cy="0" r="1" gradientTransform="translate(610 1400) scale(990 910)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#010613"/><stop offset=".7" stop-color="#01091c"/><stop offset=".87" stop-color="#021235"/><stop offset=".92" stop-color="#062a67"/><stop offset=".962" stop-color="#0e4699"/><stop offset=".99" stop-color="#337bd2"/><stop offset="1" stop-color="#78aff0"/>
    </radialGradient>
    <linearGradient id="front-cobalt" x1="276" y1="659" x2="783" y2="664" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04215c" stop-opacity="0"/><stop offset=".25" stop-color="#07256a" stop-opacity=".08"/><stop offset=".64" stop-color="#0a3287" stop-opacity=".56"/><stop offset="1" stop-color="#0b3288"/>
    </linearGradient>
    <linearGradient id="front-shadow" x1="137" y1="651" x2="679" y2="554" gradientUnits="userSpaceOnUse">
      <stop stop-color="#010617" stop-opacity="0"/><stop offset=".43" stop-color="#010617" stop-opacity="0"/><stop offset=".8" stop-color="#000411" stop-opacity=".63"/><stop offset="1" stop-color="#00040d" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="front-rim" x1="13" y1="686" x2="726" y2="534" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91baf2"/><stop offset=".26" stop-color="#acd1ff"/><stop offset=".51" stop-color="#8caef2"/><stop offset=".76" stop-color="#6c87cd"/><stop offset="1" stop-color="#6e82bd"/>
    </linearGradient>
    <clipPath id="canvas"><path d="M0 0H720V824H0z"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <path fill="#010005" d="M0 0H720V824H0z"/>
    <path fill="url(#purple-haze)" d="M0 0H720V824H0z"/>
    <path fill="url(#left-violet)" d="M0 0H720V824H0z"/>

    <!-- Upper diagonal fold. Layered translucent strokes create a gentle edge bloom. -->
    <path fill="url(#magenta-plane)" d="M208-24C356 61 487 166 594 287L750 347V-27Z"/>
    <path fill="url(#magenta-lower-glow)" d="M208-24C356 61 487 166 594 287L750 347V-27Z"/>
    <path stroke="url(#magenta-rim)" stroke-opacity=".035" stroke-width="18" d="M223-16C363 67 487 167 594 287"/>
    <path stroke="url(#magenta-rim)" stroke-opacity=".07" stroke-width="8" d="M223-16C363 67 487 167 594 287"/>
    <path stroke="url(#magenta-rim)" stroke-opacity=".19" stroke-width="3.8" d="M223-16C363 67 487 167 594 287"/>
    <path stroke="url(#magenta-rim)" stroke-opacity=".82" stroke-width="1.3" d="M223-16C363 67 487 167 594 287"/>

    <!-- Violet light spills into the lower hollow behind the two cobalt sheets. -->
    <path fill="url(#low-violet)" d="M0 250H720V824H0z"/>

    <!-- Rear convex blue sheet. -->
    <path fill="url(#back-blue)" d="M160 627C275 395 464 275 737 235L759 576C565 486 355 490 166 689Z"/>
    <path fill="url(#back-reflection)" d="M160 627C275 395 464 275 737 235L759 576C565 486 355 490 166 689Z"/>
    <path stroke="url(#blue-rim)" stroke-opacity=".08" stroke-width="7" d="M168 611C286 391 470 274 737 235"/>
    <path stroke="url(#blue-rim)" stroke-opacity=".24" stroke-width="3.5" d="M168 611C286 391 470 274 737 235"/>
    <path stroke="url(#blue-rim)" stroke-opacity=".95" stroke-width="1.5" d="M168 611C286 391 470 274 737 235"/>

    <!-- The larger foreground fold rolls toward the viewer and catches blue light. -->
    <path fill="url(#front-blue)" d="M-31 716C94 602 242 534 397 508 525 486 635 499 751 543L759 851H-31Z"/>
    <path fill="url(#front-cobalt)" d="M-31 716C94 602 242 534 397 508 525 486 635 499 751 543L759 851H-31Z"/>
    <path fill="url(#front-shadow)" d="M-31 716C94 602 242 534 397 508 525 486 635 499 751 543L749 568C630 520 524 505 398 523 244 545 97 615-31 737Z"/>
    <path stroke="url(#front-rim)" stroke-opacity=".065" stroke-width="8" d="M-31 716C94 602 242 534 397 508 525 486 635 499 751 543"/>
    <path stroke="url(#front-rim)" stroke-opacity=".16" stroke-width="4" d="M-31 716C94 602 242 534 397 508 525 486 635 499 751 543"/>
    <path stroke="url(#front-rim)" stroke-opacity=".93" stroke-width="1.7" d="M-31 716C94 602 242 534 397 508 525 486 635 499 751 543"/>
  </g>
</svg>
