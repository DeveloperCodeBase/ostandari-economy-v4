    <path stroke="url(#right-edge)" stroke-width="1.6" d="M529 331C568 289 626 252 668 210 712 167 746 126 780 69"/>
    <path fill="#0b0b12" fill-opacity=".45" d="M588 341C623 301 672 267 709 225 742 188 764 155 789 111 768 163 742 208 711 243 674 286 646 313 628 342Z"/>

